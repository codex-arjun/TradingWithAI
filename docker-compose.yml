services:
  mysql:
    image: mysql:8.0
    container_name: tradewithai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tradewithai_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tradewithai-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradewithai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tradewithai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "5050:5050"
    networks:
      - tradewithai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradewithai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3035:3035"
    networks:
      - tradewithai-net

volumes:
  mysql_data:

networks:
  tradewithai-net:
    driver: bridge